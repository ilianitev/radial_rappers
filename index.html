const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
$("#grp").innerHTML=Object.entries(GROUPS).map(([k,v])=>`<option value="${k}">Regrouper : ${v[0]}</option>`).join("");
$("#typ").innerHTML='<option value="">Tous les types de projet</option>'+[...new Set(D.map(r=>r.t))].sort().map(t=>`<option>${t}</option>`).join("");
const svg=d3.select("#viz").attr("viewBox",[-W/2,-W/2,W,W]);
let root,focus,sel,node,label,view,col,shown=40;

function tree(rows,f){const R={name:"Tout",children:[]};
 for(const r of rows){let n=R;for(const g of f(r)){let c=n.children.find(x=>x.name===g);if(!c){c={name:g,children:[]};n.children.push(c)}n=c}
  let l=n.children.find(x=>x.name===r.n);if(!l){l={name:r.n,rows:[]};n.children.push(l)}l.rows.push(r)}
 return R}

function draw(){
 svg.selectAll("*").remove();
 const q=norm($("#q").value.trim()),t=$("#typ").value;
 const rows=D.filter(r=>(!t||r.t===t)&&(!q||norm(r.ph+" "+r.n+" "+r.ti+" "+r.ap).includes(q)));
 $("#stats").textContent=`${rows.length} citations, ${new Set(rows.map(r=>r.n)).size} personnalités`;
 if(!rows.length){$("#panel").innerHTML="<h2>Aucun résultat</h2><p class='sub'>Modifiez la recherche ou le type de projet.</p>";$("#crumbs").innerHTML="";return}
 root=d3.hierarchy(tree(rows,GROUPS[$("#grp").value][1])).sum(d=>d.rows?d.rows.length:0).sort((a,b)=>b.value-a.value);
 d3.pack().size([W,W]).padding(4)(root);
 const color=d3.scaleOrdinal(root.children.map(c=>c.data.name),PAL);
 col=d=>{while(d.depth>1)d=d.parent;return color(d.data.name)};
 const all=root.descendants().slice(1);
 node=svg.append("g").selectAll("circle").data(all).join("circle")
  .attr("fill",col).attr("fill-opacity",d=>d.children?.16:.9).attr("stroke",d=>d.children?col(d):"none").attr("stroke-opacity",.6)
  .style("cursor","pointer").on("click",(e,d)=>{e.stopPropagation();pick(d)});
 node.append("title").text(d=>`${disp(d.data.name)} : ${d.value} citation${d.value>1?"s":""}`);
 label=svg.append("g").attr("pointer-events","none").attr("text-anchor","middle").selectAll("text").data(all).join("text").attr("class","lbl");
 svg.on("click",()=>focus.parent&&pick(focus.parent));
 focus=sel=root;view=[root.x,root.y,root.r*2];zoomTo(view);showLabels();info(root);
}

function zoomTo(v){view=v;const k=W/v[2];
 node.attr("transform",d=>`translate(${(d.x-v[0])*k},${(d.y-v[1])*k})`).attr("r",d=>d.r*k);
 label.filter(d=>d.parent===focus).attr("transform",d=>`translate(${(d.x-v[0])*k},${(d.y-v[1])*k+(d.children?-d.r*k+18:4)})`)
  .attr("font-size",d=>d.children?15:12).attr("font-weight",d=>d.children?800:600)
  .text(d=>{const n=disp(d.data.name),m=Math.floor(d.r*k*(d.children?1.4:1.9)/7);return d.r*k<16?"":n.length>m?n.slice(0,Math.max(m-1,1))+"…":n});
}
function showLabels(){label.attr("display",d=>d.parent===focus?null:"none")}

function pick(d){
 const f=d.children?(d===focus?(d.parent||d):d):d.parent;
 sel=d.children&&d===focus?f:d;
 if(f!==focus){focus=f;showLabels();
  svg.transition().duration(reduce?0:650).tween("z",()=>{const i=d3.interpolateZoom(view,[f.x,f.y,f.r*2+8]);return t=>zoomTo(i(t))})}
 info(sel);
}

function hl(ph,ap){let s;
 if(!ap)s=esc(ph);else try{s=ph.split(new RegExp("("+ap.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi")).map((x,i)=>i%2?"<mark>"+esc(x)+"</mark>":esc(x)).join("")}catch{s=esc(ph)}
 return s.replace(/ ; /g,"<br>")}

function info(d){
 const rows=d.leaves().flatMap(l=>l.data.rows).sort((a,b)=>a.y-b.y||a.d.localeCompare(b.d));
 shown=40;
 const path=d.ancestors().reverse();
 $("#crumbs").innerHTML="";
 path.forEach((p,i)=>{const b=document.createElement("button");b.textContent=p.depth?disp(p.data.name):"Tout";
  if(i===path.length-1){b.disabled=true;b.style.opacity=.6}
  $("#crumbs").append(b);if(i<path.length-1)$("#crumbs").append("›")});
 // les boutons du fil d'Ariane doivent zoomer sur le niveau cliqué
 [...$("#crumbs").querySelectorAll("button")].forEach((b,i)=>b.onclick=()=>{const p=path[i];focus=p.children?p:p.parent;showLabels();
  svg.transition().duration(reduce?0:650).tween("z",()=>{const v=d3.interpolateZoom(view,[focus.x,focus.y,focus.r*2+8]);return t=>zoomTo(v(t))});sel=p;info(p)});
 const leaf=!d.children;
 $("#panel").dataset.rows="";
 $("#panel")._rows=rows;
 $("#panel").innerHTML=`<h2>${d.depth?esc(disp(d.data.name)):"Toutes les citations"}</h2><div class="sub">${rows.length} citation${rows.length>1?"s":""}${leaf?"":", "+d.leaves().length+" personnalités"}</div><div id="list"></div><button id="more">Afficher plus</button>`;
 $("#more").onclick=()=>{shown+=40;list()};list();
}
function list(){const rows=$("#panel")._rows;
 $("#list").innerHTML=rows.slice(0,shown).map(r=>`<div class="q"><p>${hl(r.ph,r.ap)}</p><div class="meta"><span><b>${esc(r.ti)}</b></span><span>${esc(r.p)}, ${esc(r.d)}</span><span class="tag">${esc(disp(r.n))}</span><span>${esc(r.k)}${r.nat!=="Non applicable"?", "+esc(r.nat):""}</span></div></div>`).join("");
 $("#more").style.display=shown>=rows.length?"none":"block"}

["grp","typ"].forEach(i=>$("#"+i).onchange=draw);$("#q").oninput=draw;
draw();
</script></body></html>
